<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سیستم ارزش سامانه</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

body{
background:
radial-gradient(circle,#0f172a,#020617);
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{

background:#111827;

padding:25px;

border-radius:25px;

border:1px solid #334155;

margin-bottom:20px;

box-shadow:0 0 35px rgba(56,189,248,.15);

}

.header h1{
font-size:35px;
color:#38bdf8;
}

.header p{
margin-top:8px;
color:#94a3b8;
}

.grid{
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
}

.card{

background:#111827;

padding:20px;

border-radius:25px;

border:1px solid #334155;

}

.card h2{
margin-bottom:15px;
color:#facc15;
}

input,button,select{

width:100%;

padding:13px;

margin-top:10px;

border:none;

border-radius:14px;

outline:none;

font-size:15px;

}

input,select{
background:#1e293b;
color:white;
}

button{

background:linear-gradient(45deg,#22c55e,#16a34a);

color:white;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{
transform:translateY(-2px);
}

.tableBox{
overflow:auto;
max-height:500px;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:14px;
text-align:center;
border-bottom:1px solid #334155;
}

th{
background:#0f172a;
color:#38bdf8;
}

.editBtn{

background:#f59e0b;

padding:7px 12px;

border-radius:10px;

cursor:pointer;

font-size:13px;

display:inline-block;

}

.deleteBtn{

background:#ef4444;

padding:7px 12px;

border-radius:10px;

cursor:pointer;

font-size:13px;

display:inline-block;

margin-right:5px;

}

.chartBox{
height:400px;
}

.lockBox{

background:#220000;

padding:15px;

border-radius:18px;

border:1px solid #ef4444;

margin-bottom:15px;

text-align:center;

color:#fecaca;

}

.success{

background:#22c55e;

padding:12px;

border-radius:14px;

margin-top:10px;

text-align:center;

}

.ownerBadge{

background:#facc15;

color:#111827;

padding:8px 14px;

border-radius:12px;

display:inline-block;

font-weight:bold;

margin-top:10px;

}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📊 سیستم ارزش سامانه</h1>

<p>
مدیریت درصد ارزش و رشد سامانه
</p>

<div class="ownerBadge">
👑 فقط مالک سامانه دسترسی ویرایش دارد
</div>

</div>

<div class="grid">

<!-- پنل مدیریت -->

<div class="card">

<h2>🔐 پنل مدیریت</h2>

<select id="user">

<option value="">
انتخاب کاربر
</option>

<option value="matinhashemi">
matinhashemi 👑
</option>

</select>

<input
type="password"
id="password"
placeholder="رمز عبور">

<button onclick="loginAdmin()">
ورود مدیریت
</button>

<div id="loginMsg"></div>

<div id="adminPanel" style="display:none;">

<hr style="margin:20px 0;border-color:#334155;">

<h2>➕ ثبت درصد</h2>

<input type="date" id="date">

<input
type="number"
id="percent"
placeholder="درصد ارزش سامانه">

<button onclick="savePercent()">
ثبت درصد
</button>

<div id="msg"></div>

</div>

</div>

<!-- نمودار -->

<div class="card">

<div class="lockBox">
🔒 فقط مالک سامانه امکان ویرایش درصدها را دارد
</div>

<h2>📈 نمودار ارزش سامانه</h2>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>تاریخ</th>
<th>درصد</th>
<th>مدیریت</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

</div>

</div>

<script>

// اطلاعات مدیریت
const adminUser = "matinhashemi";

const adminPass = btoa("123458");

// دیتا
let data = JSON.parse(
localStorage.getItem("siteValueData") || "[]"
);

let editIndex = null;

let isAdmin = false;

// نمودار

const ctx =
document.getElementById("chart");

const chart = new Chart(ctx,{

type:"line",

data:{
labels:[],
datasets:[{

label:"درصد ارزش سامانه",

data:[],

borderColor:"#22c55e",

backgroundColor:"rgba(34,197,94,.2)",

fill:true,

tension:.4,

pointRadius:5

}]
},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:"white"
}
}
},

scales:{

x:{
ticks:{color:"white"}
},

y:{
ticks:{color:"white"}
}

}

}

});

render();

// ورود مدیریت
function loginAdmin(){

let user =
document.getElementById("user").value;

let pass =
document.getElementById("password").value;

if(
user === adminUser &&
pass === atob(adminPass)
){

isAdmin = true;

document.getElementById("adminPanel")
.style.display = "block";

document.getElementById("loginMsg")
.innerHTML = `

<div class="success">

✅ ورود مدیریت موفق بود

</div>

`;

}else{

document.getElementById("loginMsg")
.innerHTML = `

<div class="lockBox">

❌ اطلاعات اشتباه است

</div>

`;

}

}

// ذخیره درصد
function savePercent(){

if(!isAdmin){

alert("فقط مالک سامانه");

return;

}

let date =
document.getElementById("date").value;

let percent =
document.getElementById("percent").value;

if(!date || !percent){

alert("اطلاعات کامل نیست");

return;

}

// محدودیت درصد 🤣
if(percent > 100){

alert("🤣 ارزش سامانه بیشتر از 100 درصد نشد");

return;

}

if(editIndex === null){

data.push({

date,

percent:Number(percent)

});

}else{

data[editIndex] = {

date,

percent:Number(percent)

};

editIndex = null;

}

localStorage.setItem(
"siteValueData",
JSON.stringify(data)
);

document.getElementById("msg")
.innerHTML = `

<div class="success">

📊 درصد جدید ثبت شد

</div>

`;

document.getElementById("date").value="";
document.getElementById("percent").value="";

render();

}

// نمایش اطلاعات
function render(){

data.sort((a,b)=>
new Date(a.date)-new Date(b.date)
);

let tbody =
document.getElementById("tableBody");

tbody.innerHTML="";

data.forEach((item,index)=>{

tbody.innerHTML += `

<tr>

<td>${item.date}</td>

<td>
${item.percent}%
</td>

<td>

${
isAdmin
?

`

<span class="editBtn"
onclick="editData(${index})">

ویرایش

</span>

<span class="deleteBtn"
onclick="deleteData(${index})">

حذف

</span>

`

:

"🔒"

}

</td>

</tr>

`;

});

chart.data.labels =
data.map(x=>x.date);

chart.data.datasets[0].data =
data.map(x=>x.percent);

chart.update();

}

// ویرایش
function editData(index){

let item = data[index];

document.getElementById("date").value =
item.date;

document.getElementById("percent").value =
item.percent;

editIndex = index;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

// حذف
function deleteData(index){

if(confirm("حذف شود؟")){

data.splice(index,1);

localStorage.setItem(
"siteValueData",
JSON.stringify(data)
);

render();

}

}

</script>

</body>
</html>
